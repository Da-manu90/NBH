<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestätigung erfolgreich</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo {
            width: 300px;
            height: 300px;
            margin-bottom: 15px;
        }

        .app-name {
            font-size: 36px;
            font-weight: bold;
            color: #5A9CA5;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            color: #5A9CA5;
        }

        p {
            font-size: 18px;
            margin: 10px 0;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background-color: #5A9CA5;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }

            a:hover {
                background-color: #539198;
            }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <img src="logo_2x.png" alt="Care Community Logo" class="logo">
        <!-- App Name -->
        <div class="app-name">Care Community</div>
        <!-- Confirmation Message -->
        <h1>Bestätigung erfolgreich!</h1>
        <p>Vielen Dank, dass Sie Ihr Konto bestätigt haben.</p>
        <a href="myapp://login">Zurück zur App</a>
    </div>
</body>
</html>
